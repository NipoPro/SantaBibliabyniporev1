<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c160c"/>
      <stop offset="50%" stop-color="#120e08"/>
      <stop offset="100%" stop-color="#080604"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="85%" stop-color="#F5ECCE"/>
      <stop offset="100%" stop-color="#D4C59A"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Holy Light Rays Behind -->
  <circle cx="256" cy="230" r="160" fill="#FFD700" fill-opacity="0.06"/>
  <circle cx="256" cy="230" r="100" fill="#FFD700" fill-opacity="0.08"/>

  <!-- Bible Base Cover -->
  <path d="M 110 370 C 180 350, 230 365, 256 380 C 282 365, 332 350, 402 370 L 402 140 C 332 120, 282 135, 256 150 C 230 135, 180 120, 110 140 Z" 
        fill="#3A2814" stroke="#5E4020" stroke-width="6"/>

  <!-- Left Page Pages Thickness -->
  <path d="M 114 365 C 180 347, 230 360, 254 374 L 254 154 C 230 140, 180 126, 114 144 Z" 
        fill="url(#pageGrad)"/>
  
  <!-- Right Page Pages Thickness -->
  <path d="M 398 365 C 332 347, 282 360, 258 374 L 258 154 C 282 140, 332 126, 398 144 Z" 
        fill="url(#pageGrad)"/>

  <!-- Center spine line -->
  <line x1="256" y1="150" x2="256" y2="380" stroke="#7A5222" stroke-width="3" stroke-linecap="round"/>

  <!-- Golden Cross on Book -->
  <g filter="url(#goldGlow)">
    <!-- Vertical beam of cross -->
    <rect x="249" y="195" width="14" height="110" rx="3" fill="url(#goldGrad)"/>
    <!-- Horizontal beam of cross -->
    <rect x="220" y="222" width="72" height="14" rx="3" fill="url(#goldGrad)"/>
    <!-- Flare center -->
    <circle cx="256" cy="229" r="6" fill="#FFFBE6"/>
  </g>

  <!-- Alpha & Omega or decorative Scripture lines -->
  <path d="M 150 200 L 220 200 M 150 225 L 220 225 M 150 250 L 205 250 M 150 275 L 215 275" 
        stroke="#A89470" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 292 200 L 362 200 M 292 225 L 362 225 M 307 250 L 362 250 M 297 275 L 362 275" 
        stroke="#A89470" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Ribbon Bookmark (Gold) -->
  <path d="M 256 376 Q 260 415, 275 435 L 290 425 L 300 445 Q 275 425, 260 376 Z" 
        fill="url(#goldGrad)" opacity="0.95"/>

  <!-- BYNIPO Trademark Brand Ribbon at bottom -->
  <rect x="156" y="420" width="200" height="34" rx="17" fill="#1C170E" stroke="url(#goldGrad)" stroke-width="2"/>
  <text x="256" y="443" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" 
        letter-spacing="5" fill="#FFD700" text-anchor="middle">BYNIPO</text>
</svg>
